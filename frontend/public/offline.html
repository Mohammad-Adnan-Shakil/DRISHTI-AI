<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRISHTI — Offline</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #F8FAF7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .eye {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 {
      color: #1a5c2e;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #66756D;
      font-size: 0.9rem;
      max-width: 300px;
      margin: 0 auto 1.5rem;
    }
    .badge {
      background: #E6F4EA;
      color: #1a5c2e;
      border: 1px solid #1a5c2e;
      padding: 0.5rem 1.5rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="eye">👁️</div>
    <h1>DRISHTI — Offline Mode</h1>
    <p>You are currently offline. Screenings will be queued locally and synced when connectivity is restored.</p>
    <span class="badge">● Offline · Data Safe</span>
  </div>
</body>
</html>
